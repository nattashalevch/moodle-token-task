<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Получить отметки студента в курсах</title>
<style>
  :root {
    --page:#e8edf4; --sheet:#fff; --navy:#1b2d52; --navy-soft:#3d5282;
    --ink:#1f2937; --muted:#6b7690; --line:#d5dcea;
    --good:#1f7a5a; --good-bg:#e3f4ec; --none:#8892a8; --none-bg:#eef0f5; --bad:#b3362b;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--page); color:var(--ink);
    font:16px/1.5 "Segoe UI","Helvetica Neue",Arial,sans-serif; }
  header { background:var(--navy); color:#fff; padding:34px 20px 78px; }
  .wrap { max-width:860px; margin:0 auto; }
  h1 { margin:0; font:600 28px/1.25 Georgia,"Times New Roman",serif; }
  header p { margin:6px 0 0; color:#b9c5e2; font-size:15px; }
  main { max-width:860px; margin:-50px auto 0; padding:0 20px 60px; }

  .card { background:var(--sheet); border:1px solid var(--line); border-radius:12px;
    padding:20px 22px; box-shadow:0 12px 28px -20px rgba(27,45,82,.55); }
  form { display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .full { grid-column:1 / -1; }
  label { display:block; font-size:14px; font-weight:600; color:var(--navy-soft); }
  input[type=text], input[type=password], input:not([type]) {
    width:100%; margin-top:5px; padding:10px 12px; border:1.5px solid var(--line);
    border-radius:8px; font:inherit; color:var(--ink); background:#fbfcfe; }
  input:focus { outline:none; border-color:var(--navy-soft); box-shadow:0 0 0 3px #d6def0; }
  input[aria-invalid="true"] { border-color:var(--bad); background:#fff6f5; }
  .hint { min-height:18px; margin:3px 0 0; font-size:13px; color:var(--bad); }
  .actions { display:flex; align-items:center; gap:16px; }
  button { padding:11px 26px; border:0; border-radius:8px; background:var(--navy); color:#fff;
    font:600 16px "Segoe UI",Arial,sans-serif; cursor:pointer; transition:background .15s; }
  button:hover { background:var(--navy-soft); }
  button:focus-visible { outline:3px solid #9db0dc; outline-offset:2px; }
  button:disabled { opacity:.6; cursor:progress; }
  button.ghost { background:transparent; color:var(--navy); border:1.5px solid var(--line);
    padding:7px 14px; font-size:14px; }
  button.ghost:hover { background:#f3f6fb; }
  #state { color:var(--muted); font-size:15px; }
  #state.err { color:var(--bad); }

  .bar { margin:22px 0 10px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
    justify-content:space-between; }
  .bar .sum { color:var(--navy); font-weight:600; }
  .bar .tools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bar label { display:flex; align-items:center; gap:6px; font-weight:500; color:var(--ink); }

  details { background:var(--sheet); border:1px solid var(--line); border-radius:12px;
    margin-bottom:10px; overflow:hidden; }
  summary { list-style:none; cursor:pointer; padding:14px 20px; display:flex;
    align-items:center; justify-content:space-between; gap:14px; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸"; color:var(--navy-soft); margin-right:10px; transition:transform .15s; }
  details[open] > summary::before { transform:rotate(90deg); }
  summary:hover { background:#f6f8fc; }
  summary:focus-visible { outline:3px solid #9db0dc; outline-offset:-3px; }
  .title { flex:1; font:600 17px Georgia,serif; color:var(--navy); }
  .title small { display:block; font:400 13px "Segoe UI",sans-serif; color:var(--muted); }
  .mark { flex:none; min-width:64px; padding:5px 12px; text-align:center; border-radius:999px;
    font-weight:700; font-size:16px; background:var(--good-bg); color:var(--good); }
  .mark.none { background:var(--none-bg); color:var(--none); font-weight:500; font-size:14px; }

  .scroll { overflow-x:auto; border-top:1px solid var(--line); }
  table { border-collapse:collapse; width:100%; min-width:480px; }
  th, td { padding:9px 20px; text-align:left; border-bottom:1px solid var(--line); font-size:15px; }
  th { background:#f3f6fb; color:var(--navy-soft); font-size:13px; font-weight:600; }
  tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.got { color:var(--good); font-weight:700; }
  td.nog { color:var(--none); }
  tr.total td { background:#f3f6fb; font-weight:700; }
  .empty { padding:14px 20px; color:var(--muted); }

  @media (max-width:560px) { form { grid-template-columns:1fr; } h1 { font-size:23px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Получить отметки студента в курсах</h1>
    <p>Войдите в Moodle — отметки по всем курсам и заданиям появятся ниже.</p>
  </div>
</header>

<main>
  <section class="card">
    <form id="login" novalidate>
      <div class="full">
        <label for="site">Адрес Moodle</label>
        <input id="site" type="text" value="https://node-server.ru/m" inputmode="url">
        <p class="hint" id="e-site"></p>
      </div>
      <div>
        <label for="user">Логин</label>
        <input id="user" type="text" autocomplete="username">
        <p class="hint" id="e-user"></p>
      </div>
      <div>
        <label for="pass">Пароль</label>
        <input id="pass" type="password" autocomplete="current-password">
        <p class="hint" id="e-pass"></p>
      </div>
      <div class="full actions">
        <button id="go" type="submit">Поехали</button>
        <span id="state" role="status"></span>
      </div>
    </form>
  </section>

  <div id="bar" class="bar" hidden>
    <span class="sum" id="sum"></span>
    <span class="tools">
      <label><input type="checkbox" id="onlyGraded"> только задания с отметкой</label>
      <button type="button" class="ghost" id="openAll">Раскрыть все</button>
      <button type="button" class="ghost" id="closeAll">Свернуть все</button>
    </span>
  </div>
  <div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
let BASE = '';
let DATA = [];   // [{title, total, items:[...] }]

function flag(field, text) {
  $(field).setAttribute('aria-invalid', text ? 'true' : 'false');
  $('e-' + field).textContent = text;
  return !text;
}
function checkForm() {
  let okSite = true;
  try { new URL($('site').value.trim()); } catch { okSite = false; }
  const a = flag('site', okSite ? '' : 'Введите адрес целиком, с https://');
  const b = flag('user', $('user').value.trim() ? '' : 'Введите логин');
  const c = flag('pass', $('pass').value ? '' : 'Введите пароль');
  return a && b && c;
}
function say(t, bad) { $('state').textContent = t; $('state').className = bad ? 'err' : ''; }

async function loadToken(login, pass) {
  const r = await fetch(BASE + '/login/token.php?service=moodle_mobile_app', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ username: login, password: pass })
  });
  const j = await r.json();
  if (!j.token) throw new Error(j.error || 'не удалось получить токен');
  return j.token;
}
async function ws(token, fn, extra = {}) {
  const q = new URLSearchParams({ wstoken: token, wsfunction: fn, moodlewsrestformat: 'json', ...extra });
  const j = await (await fetch(BASE + '/webservice/rest/server.php?' + q)).json();
  if (j && j.exception) throw new Error(j.message || j.errorcode);
  return j;
}

const hasMark = v => v != null && String(v).trim() !== '' && String(v).trim() !== '-';
const clean = v => String(v == null ? '' : v).replace(/&ndash;|&mdash;/g, '–').replace(/<[^>]*>/g, '').trim();

// Название курса, которого не оказалось в списке записей
async function guessTitle(token, id) {
  try {
    const r = await ws(token, 'core_course_get_courses_by_field', { field: 'id', value: id });
    if (r.courses && r.courses[0]) return r.courses[0].fullname;
  } catch (e) { /* нет прав — останется запасное название */ }
  return 'Курс № ' + id;
}

// Подробности по одному курсу
async function loadCourse(token, userid, id, title, overviewGrade) {
  let items = [], total = null;
  try {
    const rep = await ws(token, 'gradereport_user_get_grade_items', { courseid: id, userid });
    const all = (rep.usergrades && rep.usergrades[0] && rep.usergrades[0].gradeitems) || [];
    total = all.find(g => g.itemtype === 'course') || null;
    items = all.filter(g => g.itemtype !== 'course').map(g => ({
      name: g.itemname || '(без названия)',
      grade: g.gradeformatted,
      range: clean(g.rangeformatted)
    }));
  } catch (e) { /* журнал курса недоступен */ }
  const totalGrade = total && hasMark(total.gradeformatted) ? total.gradeformatted : overviewGrade;
  return {
    title, items,
    total: hasMark(totalGrade) ? totalGrade : null,
    totalRange: total ? clean(total.rangeformatted) : ''
  };
}

function cell(tag, text, cls) {
  const n = document.createElement(tag);
  n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

function draw() {
  const only = $('onlyGraded').checked;
  const out = $('out');
  const wasOpen = new Set([...out.querySelectorAll('details[open]')].map(d => d.dataset.t));
  out.textContent = '';

  let graded = 0, all = 0;
  DATA.forEach(c => {
    const done = c.items.filter(i => hasMark(i.grade));
    graded += done.length; all += c.items.length;
    const shown = only ? done : c.items;

    const d = document.createElement('details');
    d.dataset.t = c.title;
    if (wasOpen.has(c.title)) d.open = true;

    const s = document.createElement('summary');
    const t = document.createElement('span');
    t.className = 'title';
    t.textContent = c.title;
    const sm = document.createElement('small');
    sm.textContent = 'заданий: ' + c.items.length + ', с отметкой: ' + done.length;
    t.append(sm);
    const m = document.createElement('span');
    m.className = 'mark' + (c.total ? '' : ' none');
    m.textContent = c.total || 'нет итога';
    s.append(t, m);
    d.append(s);

    if (!shown.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = only ? 'В этом курсе пока нет заданий с отметкой.' : 'В курсе нет элементов оценивания.';
      d.append(e);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'scroll';
      const tb = document.createElement('table');
      const hr = document.createElement('tr');
      hr.append(cell('th', 'Задание'), cell('th', 'Оценка', 'num'), cell('th', 'Диапазон', 'num'));
      const th = document.createElement('thead'); th.append(hr);
      const body = document.createElement('tbody');
      shown.forEach(i => {
        const tr = document.createElement('tr');
        const ok = hasMark(i.grade);
        tr.append(cell('td', i.name), cell('td', ok ? i.grade : '—', 'num ' + (ok ? 'got' : 'nog')), cell('td', i.range || '—', 'num'));
        body.append(tr);
      });
      const tot = document.createElement('tr');
      tot.className = 'total';
      tot.append(cell('td', 'Итог по курсу'), cell('td', c.total || '—', 'num'), cell('td', c.totalRange || '—', 'num'));
      body.append(tot);
      tb.append(th, body);
      wrap.append(tb);
      d.append(wrap);
    }
    out.append(d);
  });

  $('sum').textContent = 'Курсов: ' + DATA.length + ' · заданий с отметкой: ' + graded + ' из ' + all;
  $('bar').hidden = false;
}

$('onlyGraded').addEventListener('change', draw);
$('openAll').addEventListener('click', () => $('out').querySelectorAll('details').forEach(d => d.open = true));
$('closeAll').addEventListener('click', () => $('out').querySelectorAll('details').forEach(d => d.open = false));

$('login').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('out').textContent = '';
  $('bar').hidden = true;
  if (!checkForm()) { say('Заполните выделенные поля', true); return; }

  BASE = $('site').value.trim().replace(/\/+$/, '');
  $('go').disabled = true;
  try {
    say('Вхожу…');
    let token;
    try { token = await loadToken($('user').value.trim(), $('pass').value); }
    catch (e) { flag('pass', 'Проверьте логин и пароль'); throw e; }

    say('Загружаю список курсов…');
    const me = await ws(token, 'core_webservice_get_site_info');
    const [overview, courses] = await Promise.all([
      ws(token, 'gradereport_overview_get_course_grades'),
      ws(token, 'core_enrol_get_users_courses', { userid: me.userid })
    ]);

    const titles = new Map(courses.map(c => [c.id, c.fullname]));
    const list = overview.grades || [];

    say('Загружаю задания (' + list.length + ' курсов)…');
    DATA = await Promise.all(list.map(async g => {
      const title = titles.get(g.courseid) || await guessTitle(token, g.courseid);
      return loadCourse(token, me.userid, g.courseid, title, g.grade);
    }));
    DATA.sort((a, b) => a.title.localeCompare(b.title, 'ru'));

    draw();
    say('Готово');
  } catch (err) {
    say('Ошибка: ' + err.message, true);
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
